[package]
name = "optimus"
version = "0.1.0"
authors = ["Matthew Kennedy <mtthwknnd4@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"
itertools = "*"
indicatif = "*"
rand = "0.8"
rayon = "*"
bincode = "1"
half = "2"
statistical = "*"
once_cell = "*"
actix-web = "*"
actix-rt = "*"
actix-files = "*"
toml = "*"
rs_poker = "*"
criterion = { version = "*", features = ["html_reports"] }
smallvec = { version = "*", features = ["serde"] }
dashmap = { version = "*", features = ["serde"] }
ahash = { version = "*", features = ["serde"] }
memmap2 = "*"
xxhash-rust = { version = "*", features = ["xxh3"] }
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

[[bench]]
name = "benches"
harness = false

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "exploit"
path = "src/bin/exploit.rs"

[[bin]]
name = "preflop-chart"
path = "src/bin/preflop_chart.rs"

[[bin]]
name = "convert"
path = "src/bin/convert.rs"

[[bin]]
name = "bench-search"
path = "src/bin/bench_search.rs"

[[bin]]
name = "play-match"
path = "src/bin/play_match.rs"

[[bin]]
name = "match-nodes"
path = "src/bin/match_nodes.rs"

[[bin]]
name = "flop-book"
path = "src/bin/flop_book.rs"

[[bin]]
name = "aivat"
path = "src/bin/aivat.rs"

[[bin]]
name = "street-validate"
path = "src/bin/street_validate.rs"

[[bin]]
name = "datagen-bench"
path = "src/bin/datagen_bench.rs"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[[bin]]
name = "datagen-export"
path = "src/bin/datagen_export.rs"
